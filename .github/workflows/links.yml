name: Links

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress './**/*.md' outputs/decision-view.html
          fail: true
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Broken links found $(date -u +%Y-%m-%d)" \
            --body "The weekly link check failed. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} for details."
